baseURL = 'https://whisperil.github.io/Blog/'
title = 'Whisperil 的博客'
theme = 'cleanwhite'

# 最新 Hugo 语言配置
[language]
  locale = 'zh-cn'

# 分页：每页显示 8 篇文章
paginate = 8

# 允许在 Markdown 中嵌入 HTML 标签
[markup.goldmark.renderer]
  unsafe = true

# ---------------------------------------------
# 1. 站点通用参数配置 (params)
# ---------------------------------------------
[params]
  header_mapped_heading = true
  title = "Whisperil Blog"
  subtitle = "记录思考、算法与技术"
  meta_keywords = "Blog, Hugo, CleanWhite"
  description = "Whisperil 的个人博客"

  # 首页顶部全宽大图
  header_image = "img/my_bg.jpg"

  # 侧边栏/作者信息设置
  sidebar_about_description = "通信算法工程师 / R&D staff"
  sidebar_avatar = true
  avatar = "img/avatar.jpg"

  # 侧边栏功能开关
  featured_tags = true
  featured_tags_weight = 1
  featured_media = false
  reward = false

  # 社交账号图标
  github_username = "whisperil"

# ---------------------------------------------
# 2. 顶部导航菜单配置 (menu)
# 注意：明确声明 [menu] 根节点，避免被 params 吞掉
# ---------------------------------------------
# 直接使用最扁平的菜单定义
[[menu.main]]
name = "首页"
url = "/"
weight = 1

[[menu.main]]
name = "归档"
url = "/top/archive/"
weight = 2

[[menu.main]]
name = "关于"
url = "/top/about/"
weight = 3