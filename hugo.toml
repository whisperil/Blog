baseURL = 'https://whisperil.github.io/Blog/'
title = 'Arlen Diego Blog'
theme = 'cleanwhite'

# ---------------------------------------------
# 1. 语言与分页设置
# ---------------------------------------------
[language]
  locale = 'zh-cn'

paginate = 8                   # 首页每页展示 8 篇文章
preserveTaxonomyNames = true   # 保留标签/分类的大小写 (如 VCK, MPLC)
hasCJKLanguage = true          # 开启中日韩支持，确保字数与阅读时间估算精准

# ---------------------------------------------
# 2. Markdown 解析与 LaTeX 公式配置 (防转义)
# ---------------------------------------------
[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
  [markup.highlight]
    style = "dracula"          # 代码高亮主题
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true            # 允许在 Markdown 中嵌套 HTML
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true          # 开启 LaTeX/矩阵 原样传递
        delimiters = { block = [['$$', '$$'], ['\\[', '\\]']], inline = [['$', '$'], ['\\(', '\\)']] }

[outputs]
  home = ["HTML", "RSS", "Algolia"]

[outputFormats.Algolia]
  baseName = "algolia"
  isPlainText = true
  mediaType = "application/json"
  notAlternative = true

[params.algolia]
  vars = ["title", "summary", "date", "publishdate", "expirydate", "permalink"]
  params = ["categories", "tags"]

# ---------------------------------------------
# 3. 站点通用参数配置 (params)
# ---------------------------------------------
[params]
  math = false                 # 禁用主题自带的远程 unpkg 下载
  header_mapped_heading = true
  title = "Arlen Diego Blog"
  subtitle = "记录思考、算法与技术"
  SEOTitle = "Arlen Diego 的博客 | 矢量空间光通信与算法探索"
  meta_keywords = "Arlen Diego, 博客, 算法工程师, 光通信, VCK, MPLC, Python, Matlab"
  description = "Arlen Diego 的个人博客，记录通信算法、空间光通信、软件开发与技术思考。"

  # 首页顶部背景图与侧边栏
  header_image = "img/my_bg.jpg"
  sidebar_about_description = "通信算法工程师 / R&D staff"
  sidebar_avatar = "img/avatar.jpg"

  # 侧边栏功能组件开关
  featured_tags = true
  featured_tags_weight = 1
  featured_condition_size = 0
  friends = true
  bookmarks = false
  about_me = true
  last_posts = true
  reward = false

  # 404 页面
  image_404 = "img/404-bg.jpg"
  title_404 = "你来到了没有知识的荒原 :("

  algolia_search = true
  algolia_appId = "2FH2R11I39"
  algolia_indexName = "blog"               # 对应你在 Algolia 创建的 Index 名称
  algolia_apiKey = "c1a03b3ec4bb9423008ed7fb23d12062"

  # 社交账号图标
  [params.social]
    rss = true
    github = "https://github.com/whisperil"

  # ---------------------------------------------
  # Clean White 主题专用顶部导航菜单 (适配核心)
  # ---------------------------------------------
  [[params.additional_menus]]
    title = "首页"
    href = ""

  [[params.additional_menus]]
    title = "归档"
    href = "top/archive/"

  [[params.additional_menus]]
    title = "关于"
    href = "top/about/"

  # ---------------------------------------------
  # 友情链接列表
  # ---------------------------------------------
  [[params.friend_link]]
    title = "Hugo 官方文档"
    href = "https://gohugo.io/"

# ---------------------------------------------
# 4. 媒体类型定义
# ---------------------------------------------
[mediaTypes]
  [mediaTypes.'font/woff']
    suffixes = ['woff']
  [mediaTypes.'font/woff2']
    suffixes = ['woff2']